<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StillyLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="overscroll-top"></div>
<div class="site-wrapper">
<header class="navbar">
    <div class="logo">StillyLink</div>

    <nav class="nav-links">
        <a href="/">Главная</a>
        <a href="/index.html#create-chat">Создать чат</a>
        <a href="/anonymous/">Анонимное общение</a>
        <a href="/login/" class="register-btn">Регистрация</a>
    </nav>

    <div class="user-avatar hidden" onclick="toggleUserMenu()">
        <span></span>
    </div>

    <div class="user-menu">
        <a href="/profile/">Профиль</a>
        <a href="#" id="logoutBtn">Выйти</a>
    </div>

    <div class="nav-toggle" onclick="toggleMenu()">☰</div>
</header>

<div class="menu-overlay"></div>

<section class="hero">
    <h1>StillyLink</h1>
    <p>Общайся свободно. Без регистрации. Полная анонимность.</p>

    <a href="#create-chat" class="hero-btn">Создать чат</a>
</section>

<section id="create-chat" class="section">
    <h2>Создать новый чат</h2>

    <div class="card">
        <input class="input" id="roomName" type="text" placeholder="Название чата">
        <input class="input" id="userName" type="text" placeholder="Ваш ник">
        <button class="btn" id="createBtn">Создать</button>
    </div>
</section>
</div>
<footer class="footer">
    <p>© 2026 StillyLink.</p>
</footer>
      <div class="overscroll-bottom"></div>

<!-- ============== FIREBASE (ОДНОКРАТНАЯ ИНИЦИАЛИЗАЦИЯ) ============== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { 
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import { 
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

// --- CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyBWlR4QWdnbqXLKKaftEAzhXneTmV9xXX0",
    authDomain: "stillylink-f1d0f.firebaseapp.com",
    projectId: "stillylink-f1d0f",
    storageBucket: "stillylink-f1d0f.appspot.com",
    messagingSenderId: "772070114710",
    appId: "1:772070114710:web:939bce83e4d3be14bdc9b7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// UI элементы
const regBtn = document.querySelector(".register-btn");
const avatar = document.querySelector(".user-avatar");
const avatarLetter = document.querySelector(".user-avatar span");
const userMenu = document.querySelector(".user-menu");
const logoutBtn = document.getElementById("logoutBtn");

// Флаг загрузки
let isLoadingUserData = false;

// === ИСПРАВЛЕНИЕ: Функция для обновления аватара ===
async function updateUserAvatar(user) {
    if (!user || !user.email) {
        regBtn.classList.remove("hidden");
        avatar.classList.add("hidden");
        avatarLetter.textContent = "";
        localStorage.removeItem("userAvatarLetter");
        localStorage.removeItem("userAvatarSource");
        isLoadingUserData = false;
        return;
    }

    // Проверяем кэш ПЕРЕД показом UI
    const cachedLetter = localStorage.getItem("userAvatarLetter");
    const cachedSource = localStorage.getItem("userAvatarSource");
    
    if (cachedLetter && cachedSource === "name") {
        // Есть кэш с именем - показываем сразу
        regBtn.classList.add("hidden");
        avatar.classList.remove("hidden");
        avatarLetter.textContent = cachedLetter;
        return;
    }

    // НЕТ кэша или это email - начинаем загрузку
    isLoadingUserData = true;
    
    // ВАЖНО: Скрываем аватар пока загружаем данные
    avatar.classList.add("hidden");
    regBtn.classList.add("hidden");

    // Загружаем данные из Firestore
    try {
        const snap = await getDoc(doc(db, "users", user.uid));
        
        // Проверяем, не вышел ли пользователь за время загрузки
        if (!isLoadingUserData) return;
        
        let letter;
        let source;
        
        if (snap.exists() && snap.data().name) {
            // Приоритет: имя из Firestore
            letter = snap.data().name[0].toUpperCase();
            source = "name";
        } else {
            // Fallback: первая буква email
            letter = user.email[0].toUpperCase();
            source = "email";
        }
        
        // Сохраняем в кэш
        localStorage.setItem("userAvatarLetter", letter);
        localStorage.setItem("userAvatarSource", source);
        
        // Показываем аватар только ПОСЛЕ получения данных
        avatarLetter.textContent = letter;
        regBtn.classList.add("hidden");
        avatar.classList.remove("hidden");
        
    } catch (error) {
        console.error("Ошибка загрузки данных пользователя:", error);
        
        // При ошибке используем email
        if (!isLoadingUserData) return;
        
        const letter = user.email[0].toUpperCase();
        localStorage.setItem("userAvatarLetter", letter);
        localStorage.setItem("userAvatarSource", "email");
        
        avatarLetter.textContent = letter;
        regBtn.classList.add("hidden");
        avatar.classList.remove("hidden");
    } finally {
        isLoadingUserData = false;
    }
}

// === ИСПРАВЛЕНИЕ: Предзагрузка из localStorage ===
const savedLetter = localStorage.getItem("userAvatarLetter");
const savedSource = localStorage.getItem("userAvatarSource");

if (savedLetter && savedSource === "name") {
    // Показываем кэш только если это имя (не email)
    regBtn.classList.add("hidden");
    avatar.classList.remove("hidden");
    avatarLetter.textContent = savedLetter;
} else {
    // Если кэша нет или это email - показываем кнопку регистрации
    // Аватар будет показан только после загрузки данных
    regBtn.classList.remove("hidden");
    avatar.classList.add("hidden");
    avatarLetter.textContent = "";
}

// --- Авторизация ---
onAuthStateChanged(auth, updateUserAvatar);

// --- Выход ---
logoutBtn.onclick = (e) => {
    e.preventDefault();
    isLoadingUserData = false;
    localStorage.removeItem("userAvatarLetter");
    localStorage.removeItem("userAvatarSource");
    signOut(auth).then(() => window.location.reload());
};

// --- Создание чата ---
document.getElementById("createBtn").onclick = async () => {
    const roomName = document.getElementById("roomName").value.trim();
    const userName = document.getElementById("userName").value.trim();

    if (!roomName || !userName) {
        alert("Заполните все поля");
        return;
    }

    const docRef = await addDoc(collection(db, "rooms"), {
        name: roomName,
        createdAt: serverTimestamp()
    });

    window.location.href = `chat/?room=${docRef.id}&user=${encodeURIComponent(userName)}`;
};
</script>

<!-- ============== МЕНЮ НАВИГАЦИИ ============== -->
<script>
function toggleMenu() {
    const menu = document.querySelector(".nav-links");
    menu.classList.toggle("open");
}

document.addEventListener("click", function(e) {
    const menu = document.querySelector(".nav-links");
    const toggle = document.querySelector(".nav-toggle");

    if (!menu.classList.contains("open")) return;
    if (menu.contains(e.target) || toggle.contains(e.target)) return;

    menu.classList.remove("open");
});
</script>

<!-- ============== МЕНЮ АВАТАРКИ ============== -->
<script>
function toggleUserMenu() {
    document.querySelector(".user-menu").classList.toggle("open");
}

document.addEventListener("click", function(e) {
    const menu = document.querySelector(".user-menu");
    const avatar = document.querySelector(".user-avatar");

    if (!menu.classList.contains("open")) return;
    if (menu.contains(e.target) || avatar.contains(e.target)) return;

    menu.classList.remove("open");
});
</script>

</body>
</html>
