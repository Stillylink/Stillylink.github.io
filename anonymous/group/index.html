<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Анонимный чат — Группа</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="group.css">
  <link rel="stylesheet" href="mobile-search-styles.css">
</head>
<body class="group-page">
<div class="site-wrapper">
  <header class="navbar">
    <div class="logo">StillyLink</div>
    <div class="nav-search" id="navSearch">
  <div class="nav-search-input-wrap">
    <svg class="nav-search-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M13 13L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input
      type="text"
      id="navSearchInput"
      class="nav-search-field"
      placeholder="Найти пользователя..."
      autocomplete="off"
      spellcheck="false"
    />
    <button class="nav-search-clear hidden" id="navSearchClear" aria-label="Очистить">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="nav-search-dropdown hidden" id="navSearchDropdown">
    <div class="nav-search-results" id="navSearchResults"></div>
  </div>
</div>
    <nav class="nav-links">
      <a href="/">Главная</a>
      <a href="/anonymous/">Анонимное общение</a>
      <a href="/login/" class="register-btn">Регистрация</a>
    </nav>
    <div class="user-avatar hidden" onclick="toggleUserMenu()">
      <span>U</span>
    </div>
    <div class="user-menu">
      <a href="/profile/">Профиль</a>
      <a href="/anonymous/replies/">Мои ответы</a>
      <a href="#" id="logoutBtn">Выйти</a>
    </div>
    <div class="nav-toggle" onclick="toggleMenu()">☰</div>
  </header>
  <!-- ========== ОСНОВНОЙ КОНТЕЙНЕР =========== -->
  <main class="group-container">
    <div class="chat-box">
      <div class="chat-shell">
        <!-- Шапка чата -->
        <div class="chat-header">
          <div class="title">Анонимный групповой чат</div>
          <div class="chat-actions">
            <span id="onlineCount" class="hidden">0 онлайн</span>
            <button class="finish-btn" id="leaveBtn">Покинуть чат</button>
          </div>
        </div>
        <!-- Экран выбора ника -->
        <div id="joinScreen" class="join-screen">
          <div class="card">
            <h3>Придумайте никнейм</h3>
            <input
              id="nickInput"
              class="input"
              type="text"
              placeholder="От 3 до 20 символов"
              maxlength="20"
              autocomplete="off"
            />
            <div id="nickError" class="error-text"></div>
            <button id="joinBtn" class="btn">Войти в чат</button>
          </div>
        </div>
        <!-- Собственно чат -->
        <div id="chatWindow" class="chat-window hidden">
          <div class="messages" id="messages" role="log" aria-live="polite"></div>
          <div class="composer">
            <input type="file" id="photoInput" accept="image/*" class="hidden">
            <button title="Добавить фото" class="tool-btn" id="photoBtn">📷</button>
            <button title="Emoji" class="tool-btn" id="emojiBtn">😊</button>
            <textarea
              id="textInput"
              class="text-input"
              placeholder="Сообщение..."
              rows="1"
            ></textarea>
            <button id="sendBtn" class="btn">Отправить</button>
          </div>
        </div>
      </div>
      <!-- Панель эмодзи -->
      <div id="emojiPanel" class="emoji-panel hidden">
        <button class="tool-btn emoji">😀</button>
        <button class="tool-btn emoji">😂</button>
        <button class="tool-btn emoji">😍</button>
        <button class="tool-btn emoji">😢</button>
        <button class="tool-btn emoji">😮</button>
        <button class="tool-btn emoji">👍</button>
        <button class="tool-btn emoji">🙏</button>
        <button class="tool-btn emoji">🔥</button>
        <button class="tool-btn emoji">🤝</button>
        <button class="tool-btn emoji">🎉</button>
      </div>
    </div>
  </main>
  <footer class="footer">© 2026 StillyLink.</footer>
</div>
<script type="module" src="group.js"></script>
<script type="module" src="/search.js"></script>
<script src="mobile-search.js"></script>
</body>
</html>
